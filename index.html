<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascent</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2748f5">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#e9ebee;--card:#fff;--ink:#12151c;--dim:#5c6472;--line:#d3d7de;--blue:#2748f5;--blue2:#1b33b8;--tape:#ffd43b;--ok:#1e9e6a;--bad:#d6402f;
--disp:Bahnschrift,"DIN Alternate","Arial Narrow",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
header{background:var(--blue);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font:700 24px var(--disp);letter-spacing:.02em}
#tag{font:600 13px var(--disp);background:var(--tape);color:var(--ink);padding:4px 11px;border-radius:4px}
main{max-width:560px;margin:0 auto;padding:16px 14px}
.view{display:none}.view.on{display:block}
h2{font:700 20px var(--disp);margin:6px 0 10px}
.sub{color:var(--dim);font-size:13px}
.day{background:var(--ink);color:#fff;border-radius:10px;padding:16px 18px;margin-bottom:12px}
.day b{font:700 30px var(--disp);display:block}
.day span{color:#b9c0cc;font-size:13px}
.rest{position:sticky;top:58px;z-index:5;display:flex;gap:8px;align-items:center;background:var(--bg);padding:6px 0 10px}
.rest button{flex:1;background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:10px;font:700 14px var(--disp);color:var(--ink)}
.rest button.run{background:var(--tape)}
#rt{font:700 22px var(--disp);min-width:64px;text-align:center}
.blk{background:var(--card);border-left:6px solid var(--blue);border-radius:4px 12px 12px 4px;padding:16px;margin-bottom:12px}
.blk.pl{border-left-color:var(--tape)}
.bh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.trk{font:600 13px var(--disp);color:var(--blue);letter-spacing:.04em}
.big{font:700 40px/1 var(--disp);margin:4px 0}
.nm{font-weight:600}
.pips{display:flex;gap:5px;margin-top:6px}
.pips i{width:16px;height:8px;border-radius:2px;background:var(--line)}
.pips i.f{background:var(--tape);outline:1px solid #b8951a}
.cue{color:var(--dim);font-size:13.5px;margin:10px 0}
.sets{display:flex;gap:8px}
.sets label{flex:1;font-size:11px;color:var(--dim)}
.sets input{width:100%;margin-top:3px;font:700 22px var(--disp);text-align:center;padding:10px 2px;border:2px solid var(--line);border-radius:8px;background:#f6f7f9;color:var(--ink)}
.sets input:focus{outline:none;border-color:var(--blue);background:#fff}
.sets input.bad{border-color:var(--bad)}
.pain{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--dim)}.pain input{width:18px;height:18px;accent-color:var(--bad)}
.err{color:var(--bad);font-size:12px;margin-top:6px;display:none}
.prep label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.prep label:last-child{border:0}
.prep input{width:20px;height:20px;accent-color:var(--blue);margin-top:2px}
.prep small{display:block;color:var(--dim)}
textarea{width:100%;min-height:64px;border:2px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:#f6f7f9}
.go{width:100%;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:17px;font:700 18px var(--disp);letter-spacing:.03em;margin-top:6px}
.go:active{background:var(--blue2)}.go:disabled{background:#9aa3b5}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px}
.ph{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ph:last-child{border:0}
.ph em{font:700 13px var(--disp);font-style:normal;width:64px;flex-shrink:0;color:var(--dim)}
.ph.cur em{color:var(--blue)}.ph.cur{font-weight:600}
.st{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.st:last-child{border:0}
.st .d{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex-shrink:0}
.st.done .d{background:var(--ok);border-color:var(--ok)}
.st.cur .d{background:var(--tape);border-color:var(--ink)}
.st.cur{font-weight:700}
.st .t{margin-left:auto;font:600 13px var(--disp);color:var(--dim)}
.lock{opacity:.9;border:2px dashed var(--dim);background:transparent}
.req{font-size:13px;color:var(--dim)}.req b{color:var(--ok)}.req s{color:var(--dim)}
.he{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.he:last-child{border:0}.he b{font-family:var(--disp)}
.btn{display:block;width:100%;background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:12px;font:700 14px var(--disp);margin-bottom:8px;color:var(--ink)}
.row{display:flex;gap:8px}
.danger{color:var(--bad);border-color:var(--bad)}
.g p{margin-bottom:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--ink);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;font:600 12px var(--disp);color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--blue)}
#toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-150%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font:600 14px var(--disp);z-index:99;transition:transform .3s;max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="toast" role="status"></div>
<header><h1>ASCENT</h1><span id="tag">Session 1</span></header>
<main>
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-road"></section>
  <section class="view" id="v-log"></section>
  <section class="view g" id="v-guide"></section>
</main>
<nav>
  <button class="on" data-v="today"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>Today</button>
  <button data-v="road"><svg viewBox="0 0 24 24"><path d="M4 20l6-8 4 4 6-10"/></svg>Roadmap</button>
  <button data-v="log"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6"/></svg>Log</button>
  <button data-v="guide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M12 11v5"/></svg>Guide</button>
</nav>
<script>
/* ---------- PROGRAM DATA: [name, sets, target, unit, cue] ---------- */
const TRACKS={
handstand:{name:'Handstand',stages:[
 ['Pike Hold',3,30,'s','Hands shoulder-width, hips stacked high over hands, legs straight. Push the floor away, head between arms.'],
 ['Wall Walks',3,5,'reps','Start on your belly, feet at the wall. Walk hands in until your nose nearly touches, then walk back. Slow.'],
 ['Chest-to-Wall Hold',4,30,'s','Face the wall, walk up until chest touches. Ribs in, glutes tight, shoulders pushed tall by your ears.'],
 ['Kick-up + Toe Pulls',5,15,'s','Kick up facing the wall, then pull the heels off so only toes touch. Fingertips grip the floor to catch balance.'],
 ['Freestanding Balance',6,5,'s','Kick up away from the wall. Practice a cartwheel bail-out first. Only clean holds count.'],
 ['Freestanding Handstand',5,10,'s','Straight line, hollow ribs, eyes between your hands. Balance with fingertips and palm heels.']]},
push:{name:'Push',stages:[
 ['Push-up',3,15,'reps','Elbows ~45°, straight line head to heel, chest to floor, full lockout.'],
 ['Pike Push-up',3,10,'reps','Hips high, head travels between the hands. Builds the shoulder strength handstand needs.'],
 ['Elevated Pike Push-up',3,8,'reps','Feet on a chair. More of your bodyweight sits over the shoulders. Slow lowering.'],
 ['Pseudo Planche Push-up',3,8,'reps','Hands by the waist, fingers back or out. Lean shoulders past hands, keep hollow body, push.']]},
pull:{name:'Pull',stages:[
 ['Dead Hang',3,30,'s','Active hang: shoulders pulled down away from ears, ribs in. Grip only as long as form holds.'],
 ['Scapular Pull-up',3,8,'reps','Arms straight. Pull shoulder blades down and back to lift a few cm. No elbow bend.'],
 ['Negative Pull-up',3,5,'reps','Jump or step to chin over the bar, lower for a slow 5-count to full hang.'],
 ['Chin-up',3,5,'reps','Underhand grip, chest to the bar, controlled lowering, full hang each rep.'],
 ['Pull-up',3,8,'reps','Overhand, shoulder-width. Chin clears the bar, no kipping, full hang at the bottom.']]},
legs:{name:'Legs',stages:[
 ['Squat',3,20,'reps','Feet shoulder-width, hips back and down, heels flat, thighs to parallel or lower, chest tall.'],
 ['Split Squat',3,10,'leg','Long staggered stance. Back knee drops straight down, front knee tracks over the toes. Reps per leg.'],
 ['Bulgarian Split Squat',3,10,'leg','Rear foot on a chair. Drop straight down on the front leg, full depth. Reps per leg.'],
 ['Assisted Pistol',3,5,'leg','Single-leg squat to a low box or chair, holding a doorframe for light help. Reps per leg.'],
 ['Pistol Squat',3,5,'leg','Full single-leg squat, other leg straight out, heel down. Reps per leg.']]},
core:{name:'Core',stages:[
 ['Hollow Hold',3,30,'s','Lower back glued to the floor, arms overhead, legs low but not arching. The shape underlies every skill here.'],
 ['Tuck L-sit',3,15,'s','Hands by the hips (floor or two chairs), push down hard, knees to chest, hips off the floor.'],
 ['One-Leg L-sit',3,12,'s','One leg straight out, one tucked. Swap legs each set. Shoulders depressed, arms locked.'],
 ['L-sit',3,10,'s','Both legs straight and parallel to the floor. Push the floor away, toes pointed.']]},
planche:{name:'Planche',stages:[
 ['Planche Lean',4,20,'s','Straight-arm plank, lean shoulders past the hands until wrists load. Protract, keep hollow. Stop if wrists hurt.'],
 ['Tuck Planche',4,10,'s','From the lean, lift the feet, knees tucked tight, back rounded, arms straight. Hips level with shoulders.'],
 ['Advanced Tuck Planche',4,8,'s','Flat back, hips at shoulder height, knees pulled in but not to the chest.'],
 ['Straddle Planche',4,5,'s','Legs wide, body horizontal. The finish line of this program; expect a year or more.']]}};
const DAY={A:['handstand','planche','push','core'],B:['handstand','pull','legs','core']};
const PREP=[['Wrist prep · 2 min','Circles, finger pulls, palm-down and palm-up rocks. Non-negotiable for handstand and planche.'],
 ['Overhead shoulder opener · 1 min','Arms overhead against a wall, ribs down, gently press the chest toward the floor. Open shoulders make a straight handstand line possible.'],
 ['Shoulder switch-on · 2 sets of 10','Scapular push-ups: straight arms, push tall, sink, repeat.'],
 ['Hollow rocks · 2 sets of 10','Keep the hollow shape and rock without losing it.']];
const CLEAN=3, MISS=3, KEY='ascent_v1';

/* ---------- STATE ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const int=(v,lo,hi,d)=>{v=Number(v);return Number.isInteger(v)&&v>=lo&&v<=hi?v:d};
const def=()=>({v:1,sessions:0,next:'A',planche:false,eased:'',tracks:Object.fromEntries(Object.keys(TRACKS).map(k=>[k,{stage:0,clean:0,miss:0}])),history:[],draft:{}});
function sanitize(s){
  if(!s||typeof s!=='object'||!s.tracks||typeof s.tracks!=='object')return null;
  const o=def();
  o.sessions=int(s.sessions,0,100000,0);o.next=s.next==='B'?'B':'A';o.planche=!!s.planche;o.eased=typeof s.eased==='string'?s.eased:'';
  for(const k in TRACKS){const t=s.tracks[k]||{};o.tracks[k]={stage:int(t.stage,0,TRACKS[k].stages.length-1,0),clean:int(t.clean,0,CLEAN,0),miss:int(t.miss,0,MISS,0)}}
  o.history=Array.isArray(s.history)?s.history.filter(h=>h&&typeof h==='object'&&h.entries&&typeof h.entries==='object').slice(0,500):[];
  o.draft=s.draft&&typeof s.draft==='object'?s.draft:{};
  return o;
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);if(!raw)return def();const s=sanitize(JSON.parse(raw));if(s)return s}catch(e){}
  try{if(raw)localStorage.setItem(KEY+'_corrupt',raw)}catch(e){}  /* never overwrite unreadable data */
  return def();
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage full or blocked. Export a backup.')}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)}
const unit=(u,n)=>u==='s'?n+'s':u==='leg'?n+' reps/leg':n+' reps';
function checkLayoff(){
  if(!S.history.length)return;
  const last=S.history[0].date,gap=Math.floor((Date.now()-new Date(last))/86400000);
  if(!last||S.eased===last||isNaN(gap)||gap<14)return;
  const back=gap>=28;
  for(const k in S.tracks){const t=S.tracks[k];t.clean=0;t.miss=0;if(back&&t.stage>0)t.stage--}
  S.eased=last;save();
  setTimeout(()=>toast(gap+' days off: '+(back?'every track eased back one stage. ':'clean-session counts reset. ')+'Do the first session at about 70% of the usual reps or holds.'),400);
}
const gates=()=>[['Push: reach Pseudo Planche Push-up (Elevated Pike done)',S.tracks.push.stage>=3],['Core: Tuck L-sit 15s done (reach One-Leg L-sit)',S.tracks.core.stage>=2],['Handstand: Chest-to-Wall Hold unlocked',S.tracks.handstand.stage>=2]];
function checkUnlock(){if(!S.planche&&gates().every(g=>g[1])){S.planche=true;return true}return false}
const today=()=>DAY[S.next].filter(k=>k!=='planche'||S.planche);

/* ---------- TODAY ---------- */
function renderToday(){
  $('tag').textContent='Session '+(S.sessions+1);
  const ks=today();
  let h=`<div class="day"><b>Day ${S.next}</b><span>${ks.map(k=>TRACKS[k].name).join(' · ')}</span></div>
  <div class="rest"><button data-r="90">1:30</button><div id="rt">–</div><button data-r="150">2:30</button><button data-r="210">3:30</button></div>
  <div class="card prep"><h2>Prep (do first)</h2>${PREP.map((p,i)=>`<label><input type="checkbox" data-p="${i}"${S.draft['p'+i]?' checked':''}><span>${p[0]}<small>${p[1]}</small></span></label>`).join('')}</div>`;
  ks.forEach(k=>{
    const T=TRACKS[k],t=S.tracks[k],st=T.stages[t.stage],[n,sets,tg,u,cue]=st;
    h+=`<div class="blk${k==='planche'?' pl':''}" data-k="${k}">
      <div class="bh"><div><div class="trk">${T.name.toUpperCase()} · STAGE ${t.stage+1}/${T.stages.length}</div><div class="big">${sets}×${unit(u,tg)}</div><div class="nm">${esc(n)}</div></div>
      <div><div class="sub">Clean sessions</div><div class="pips">${Array.from({length:CLEAN},(_,i)=>`<i class="${i<t.clean?'f':''}"></i>`).join('')}</div></div></div>
      <div class="cue">${esc(cue)}</div>
      <div class="sets">${Array.from({length:sets},(_,i)=>`<label>Set ${i+1}<input type="number" inputmode="numeric" min="0" step="1" data-k="${k}" data-i="${i}" placeholder="${tg}" value="${S.draft[k+'_'+i]??''}"></label>`).join('')}</div>
      <label class="pain"><input type="checkbox" data-pain="${k}"${S.draft['pain_'+k]?' checked':''}> Joint pain during this exercise</label>
      <div class="err" id="e_${k}"></div></div>`;
  });
  h+=`<div class="card"><label class="sub" for="notes">Notes: sleep, wrists, what felt off</label><textarea id="notes">${esc(S.draft.notes||'')}</textarea></div>
  <button class="go" id="done">COMPLETE SESSION</button>
  <p class="sub" style="text-align:center;margin-top:10px">Enter every set. Hit the target on all sets for ${CLEAN} sessions in a row to move up. Pain in a joint: stop that exercise.</p>`;
  $('v-today').innerHTML=h;
}
$('v-today').addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.i!==undefined)S.draft[el.dataset.k+'_'+el.dataset.i]=el.value;
  else if(el.dataset.pain!==undefined)S.draft['pain_'+el.dataset.pain]=el.checked;
  else if(el.dataset.p!==undefined)S.draft['p'+el.dataset.p]=el.checked;
  else if(el.id==='notes')S.draft.notes=el.value;
  else return;
  save();
});
$('v-today').addEventListener('click',e=>{
  if(e.target.id==='done')return complete();
  const r=e.target.dataset.r;if(r)startRest(+r,e.target);
});
let rTimer=null;
function startRest(sec,btn){
  clearInterval(rTimer);
  document.querySelectorAll('.rest button').forEach(b=>b.classList.remove('run'));
  btn.classList.add('run');
  const end=Date.now()+sec*1000;   /* timestamp-based: survives throttling */
  const tick=()=>{
    const left=Math.ceil((end-Date.now())/1000),d=$('rt');if(!d)return clearInterval(rTimer);
    if(left<=0){clearInterval(rTimer);d.textContent='GO';btn.classList.remove('run');if(navigator.vibrate)navigator.vibrate([250,100,250]);return}
    d.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  };
  tick();rTimer=setInterval(tick,250);
}

/* ---------- COMPLETE SESSION ---------- */
function complete(){
  const ks=today(),entries={};let ok=true;
  ks.forEach(k=>{
    const st=TRACKS[k].stages[S.tracks[k].stage],ins=[...document.querySelectorAll(`input[data-k="${k}"]`)],vals=[];let bad=false;
    ins.forEach(inp=>{
      const raw=inp.value.trim(),v=Number(raw);
      if(raw===''||!Number.isInteger(v)||v<0||v>(st[3]==='s'?600:200)){bad=true;inp.classList.add('bad')}else{inp.classList.remove('bad');vals.push(v)}
    });
    const eb=$('e_'+k);eb.style.display=bad?'block':'none';eb.textContent='Enter a whole number for every set (0 if you missed it).';
    if(bad)ok=false;else entries[k]={stage:st[0],vals,target:st[2],unit:st[3],met:vals.every(v=>v>=st[2]),pain:!!(document.querySelector(`input[data-pain="${k}"]`)||{}).checked};
  });
  if(!ok)return toast('Fill in every set first');
  const prev={tracks:JSON.parse(JSON.stringify(S.tracks)),planche:S.planche},msgs=[];
  ks.forEach(k=>{
    const t=S.tracks[k],T=TRACKS[k],e=entries[k];
    if(e.pain){t.clean=0;msgs.push(T.name+': pain logged, no progress this session. Cut volume, rest 2 to 3 days; see a physio if it persists')}
    else if(e.met){t.miss=0;t.clean++;
      if(t.clean>=CLEAN){t.clean=0;if(t.stage<T.stages.length-1){t.stage++;msgs.push(T.name+' up: '+T.stages[t.stage][0])}else msgs.push(T.name+' mastered')}
    }else{t.clean=0;t.miss++;
      if(t.miss>=MISS){t.miss=0;if(t.stage>0){t.stage--;msgs.push(T.name+' stepped back to '+T.stages[t.stage][0]+' to rebuild')}else msgs.push(T.name+': keep the target and rest longer')}
    }
  });
  if(checkUnlock())msgs.push('Planche track unlocked');
  S.history.unshift({n:S.sessions+1,day:S.next,date:new Date().toISOString().slice(0,10),entries,notes:(S.draft.notes||'').trim(),prev});
  S.sessions++;S.next=S.next==='A'?'B':'A';S.draft={};save();
  toast(msgs.length?msgs.join(' · '):'Session logged');
  renderAll();window.scrollTo(0,0);
}
function undo(){
  const h=S.history[0];if(!h||!confirm('Undo session #'+h.n+'? Stage progress reverts and it becomes today\'s session again.'))return;
  const s=sanitize({...S,tracks:h.prev.tracks});if(!s)return;
  S.tracks=s.tracks;S.planche=!!h.prev.planche;S.history.shift();S.sessions=Math.max(0,S.sessions-1);S.next=h.day;save();renderAll();toast('Session undone');
}

/* ---------- ROADMAP ---------- */
function phase(){return S.planche?3:S.tracks.handstand.stage>=3?2:1}
function renderRoad(){
  const P=[['Phase 1','Build the base: wrist prep, hollow body, pike strength, wall handstand, first pull-ups. About 8 to 12 weeks.'],
   ['Phase 2','Learn the skills: freestanding handstand, tuck to full L-sit, strict pull-up. Months 3 to 6.'],
   ['Phase 3','Planche: lean, tuck, advanced tuck, straddle. Starts once the base is proven; expect a year or more to straddle.']];
  let h=`<h2>Route</h2><div class="card">${P.map((p,i)=>`<div class="ph${phase()===i+1?' cur':''}"><em>${p[0]}</em><span>${p[1]}</span></div>`).join('')}</div>`;
  for(const k in TRACKS){
    const T=TRACKS[k],t=S.tracks[k],locked=k==='planche'&&!S.planche;
    h+=`<div class="card${locked?' lock':''}"><h2>${T.name}${locked?' (locked)':''}</h2>`;
    if(locked)h+=`<p class="req">Unlocks when your base is ready. This protects wrists and shoulders.</p><p class="req">${gates().map(g=>g[1]?`<b>✓ ${g[0]}</b>`:`<s>○ ${g[0]}</s>`).join('<br>')}</p>`;
    else T.stages.forEach((s,i)=>{h+=`<div class="st ${i<t.stage?'done':i===t.stage?'cur':''}"><span class="d"></span>${esc(s[0])}<span class="t">${s[1]}×${unit(s[3],s[2])}</span></div>`});
    h+='</div>';
  }
  $('v-road').innerHTML=h;
}

/* ---------- LOG / DATA ---------- */
function renderLog(){
  let h='<h2>Log</h2>';
  h+=S.history.length?`<div class="card">${S.history.slice(0,60).map(x=>`<div class="he"><b>#${x.n} · Day ${esc(x.day)}</b> <span class="sub">${esc(x.date||'')}</span><br>${Object.keys(x.entries).filter(k=>TRACKS[k]).map(k=>{const e=x.entries[k];return `${TRACKS[k].name}: ${esc(e.stage)} ${(e.vals||[]).map(Number).join('/')} ${e.met?'✓':''}${e.pain?' ⚠':''}`}).join('<br>')}${x.notes?`<br><i class="sub">${esc(x.notes)}</i>`:''}</div>`).join('')}</div><button class="btn" id="undo">Undo last session</button>`:'<div class="card sub">No sessions yet. Complete Today\'s session to start the log.</div>';
  h+=`<h2>Backup</h2><p class="sub" style="margin-bottom:8px">Progress lives only in this browser. Export after each stage-up.</p><div class="row"><button class="btn" id="exp">Export</button><button class="btn" id="imp">Import</button></div><input type="file" id="file" accept="application/json" hidden><button class="btn danger" id="reset">Reset all progress</button>`;
  $('v-log').innerHTML=h;
}
$('v-log').addEventListener('click',e=>{
  const id=e.target.id;
  if(id==='undo')undo();
  if(id==='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='ascent-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}
  if(id==='imp')$('file').click();
  if(id==='reset'&&confirm('Erase all sessions and progress?')){S=def();save();renderAll();toast('Progress reset')}
});
$('v-log').addEventListener('change',e=>{
  if(e.target.id!=='file'||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{const s=sanitize(JSON.parse(r.result));if(!s)throw 0;if(confirm('Replace current progress with this backup?')){S=s;save();renderAll();toast('Backup restored')}}catch(x){toast('Not a valid Ascent backup')}};
  r.readAsText(e.target.files[0]);e.target.value='';
});

/* ---------- GUIDE ---------- */
$('v-guide').innerHTML=`<h2>How Ascent works</h2>
<div class="card"><p><b>Direct route.</b> Every skill is trained through the strength it needs: hollow body and pike work feed handstand, straight-arm and core work feed planche. You only work the stage you are on.</p>
<p><b>Why handstand first.</b> It is the most common skill, needs only a wall and short daily-style practice, and builds the wrist and shoulder tolerance planche demands. L-sit and pull-up run alongside as strength tracks. Planche unlocks when the base is proven.</p>
<p><b>Advance rule.</b> Hit the target on every set for ${CLEAN} sessions in a row. Skill holds are hard on tendons, so the bar is stricter than a rep scheme.</p>
<p><b>Step-back rule.</b> ${MISS} misses in a row drops you one stage to rebuild. It is a regression, not a failure.</p>
<p><b>Schedule.</b> Sessions alternate Day A and Day B, 3 to 4 per week, with rest days between. Handstand and Planche run first while you are freshest; Push, Pull, Legs and Core follow. Expect roughly 35 to 45 minutes per session.</p>
<p><b>Equipment.</b> A wall, a doorway pull-up bar, and a sturdy chair (split squats, L-sits).</p>
<p><b>Realistic timing.</b> Freestanding handstand: 3 to 6 months. Full L-sit: 2 to 4 months. Strict pull-up: 2 to 4 months. Straddle planche: 1 to 2+ years — that's the realistic finish line for most people. Full planche is beyond this program.</p>
<p><b>After a break.</b> 14 to 27 days off resets your clean-session counts; 28+ days also eases every track back one stage. Do the first session back at about 70%.</p>
<p><b>Legs.</b> Day B includes legs, ending in the pistol squat. Strong legs and hips support balance and overall joint health.</p><p><b>Pain rule.</b> Tick the pain box on any exercise that hurts a joint. That session gives no progress credit, and you should cut volume and rest. Wrists and elbows take the load in handstand and planche, so never train through sharp pain.</p><p><b>Planche gate.</b> Common guidance asks for about a 10 to 15 second L-sit and solid push strength before tuck planche work, so Planche unlocks only after Pseudo Planche Push-up, Tuck L-sit 15s and the Chest-to-Wall Hold. Straddle planche is this program's finish line; full planche is a separate multi-year goal.</p></div>`;

  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('nav button,.view').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$('v-'+b.dataset.v).classList.add('on');window.scrollTo(0,0);
});
function renderAll(){renderToday();renderRoad();renderLog()}
checkLayoff();renderAll();
