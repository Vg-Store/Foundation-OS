  h+=`<div class="roadcard ${locked?'locked':''}"><h2>${T.name}${locked?' · Locked':''}</h2>`;
  if(locked)h+=`<p class="sub">Unlocks once you reach: ${GATES.map(([g,n])=>{const ok=S.tracks[g].stage>=idx(g,n);return `${ok?'✓ ':''}${TRACKS[g].name} · ${n}`}).join(', ')}.</p>`;
  else h+=T.stages.map((s,i)=>`<div class="stage ${i<t.stage?'done':i===t.stage?'cur':''}"><span class="dot"></span><span>${esc(s[0])}</span><span class="target">${s[1]}×${unit(s[3],s[2])}</span></div>${i===t.stage?`<div class="sub" style="margin:-2px 0 8px 24px">Advance: ${CLEAN} clean sessions${T.type==='skill'?` (${needSets(k,s)} of ${s[1]} sets ≥ ${unit(s[3],s[2])})`:''}${needsForm(k,i)?' + form check':''}</div>`:''}`).join('');
  h+='</div>'}
 $('v-road').innerHTML=h}

 const st=S.settings,perm='Notification'in window?Notification.permission:'unsupported';
 const yn=[[1,'On'],[0,'Off']];
 let h='<h2>Log & settings</h2>';
 h+=`<div class="card"><h2>Timer & alerts</h2><p class="sub">Hold timers (▶ Timer on time-based sets) and rest timers use these. Each timed exercise can also have its own get-ready time on its card (e.g. 6 s for handstand).</p><div class="readiness" style="grid-template-columns:1fr 1fr">
 <label>Sound<select data-s="sound">${opts(yn,st.sound?1:0)}</select></label>

 <p class="notice" style="text-align:left">Web apps can't ring while the phone is locked or the app is closed. Keep the app open with the screen on; the timer holds the screen awake for you.</p></div>`;
 h+=`<div class="card"><div class="grid2"><div class="stat"><b>${S.sessions}</b><span>Total sessions</span></div><div class="stat"><b>${S.history.length?S.history[0].date:'—'}</b><span>Last session</span></div></div><button class="btn" id="undo" ${S.history.length&&S.history[0].prev?'':'disabled'}>UNDO LAST SESSION</button><button class="btn" id="rebase">RE-RUN BASELINE TEST</button><button class="btn" id="export">EXPORT BACKUP</button><button class="btn" id="importBtn">IMPORT BACKUP</button><input id="file" type="file" accept="application/json" hidden><button class="btn danger" id="reset">RESET ALL PROGRESS</button></div>`;
 h+=`<div class="card"><h2>Session history</h2>${S.history.length?S.history.slice(0,60).map(x=>`<div class="history"><b>#${x.n} · Day ${esc(x.day)} · ${esc(x.date)}${x.recovery?' · recovery':x.reduced?' · reduced':''}</b><br><span class="sub">${Object.keys(x.entries).map(k=>{const e=x.entries[k];return `${TRACKS[k]?TRACKS[k].name:esc(k)}: ${e.vals.join('/')} ${e.met?'✓':e.near?'≈':''}${e.pain?' ⚠':''}`}).join(' · ')}</span>${x.notes?`<br><i class="sub">${esc(x.notes)}</i>`:''}</div>`).join(''):'<p class="sub">No sessions yet.</p>'}</div>`;

$('v-log').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='export'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ascent-backup-'+ymd()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exported')}
 else if(b.id==='importBtn')$('file').click();
 else if(b.id==='reset'&&confirm('Erase all Ascent progress?')){S=def();save();endTimer();renderAll();show('today');toast('Progress reset');setTimeout(openSetup,350)}
 else if(b.id==='undo')undoLast();
 else if(b.id==='rebase')openSetup();
 else if(b.id==='testSound'){unlock();play('ring');clearTimeout(testSound.t);testSound.t=setTimeout(stopAlarm,2600);buzz([200,100,200])}
 else if(b.id==='notif'){try{Promise.resolve(Notification.requestPermission()).then(()=>renderLog())}catch(x){}}});
function testSound(){}
$('v-log').addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.s){const k=el.dataset.s,bools=['sound','vibrate','count','auto','awake'],nums=['ready','rest'];S.settings[k]=bools.includes(k)?el.value==='1':nums.includes(k)?+el.value:el.value;S.settings=cleanSettings(S.settings);save();
  if(k==='tone'||k==='vol'){unlock();play('ring');clearTimeout(testSound.t);testSound.t=setTimeout(stopAlarm,1800)}return}
 if(el.id!=='file'||!el.files[0])return;
 const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x&&x.tracks&&x.tracks.push&&(x.v||0)<3&&!('settings'in x)){if(Array.isArray(x.history))x.history.forEach(h=>{if(h&&h.prev&&h.prev.tracks&&h.prev.tracks.push)mapPush(h.prev.tracks.push)});mapPush(x.tracks.push);x.tracks.push.clean=0;x.tracks.push.miss=0}
  const o=sanitize(x);if(!o)throw 0;const lost=(Array.isArray(x.history)?x.history.length:0)-o.history.length;if(confirm('Replace current progress with this backup? '+o.history.length+' sessions found'+(lost>0?', '+lost+' damaged or extra records will be discarded':'')+'.')){S=o;save();renderAll();toast('Backup restored'+(lost>0?' · '+lost+' damaged records discarded':''))}}catch(z){toast('Invalid Ascent backup')}el.value=''};r.readAsText(el.files[0])});
function renderGuide(){$('v-guide').innerHTML=`<h2>Guide</h2>
<details open><summary>How progression works</summary><p>A clean session means hitting the target on every set (for skill holds, on most sets, for example 3 of 5) at any effort short of Near max. Three clean full-volume sessions advance you. Near max still counts, but you must repeat once more before advancing. Reduced-volume days are skipped: they neither count nor reset your streak. A miss, pain or an unconfirmed form check resets it. Planche and L-sit stages also need a self-checked form pass. Reach at least 80% of the target on every set and it counts as "very close": no advance, but no penalty either. Below that, three misses in a row step you back one stage. Reduced-volume sessions (recovery, low readiness, back from a break) and pain never advance a stage, and reduced sessions never count as misses. After a baseline, your first two full sessions on each exercise are a placement check: a clear miss moves you back one stage immediately, and the new stage gets its own two-session check. Your last numbers and best set show on each exercise, so you can see progress before a stage-up.</p></details>
<details><summary>Can't hit the target yet?</summary><p>That is what the earlier stages are for. Push starts with incline push-ups (12 reps) before the floor push-up (15). Log honest numbers: 10-9-8 beats 9-9-9 and shows in the completion chart even though the stage waits. When you can hit the target with clean form, you move up.</p></details>
<details><summary>Timers & alerts</summary><p>Rest: tap 1:00 to 3:00 or let Ascent auto-start it after each set you enter. On time-based sets tap ▶ Timer: a get-ready countdown, then a count-up hold with a chime at your target. Keep holding past it if you can; STOP & SAVE writes your actual seconds into the set. Tune sound, ringtone, vibration and countdown in Log. Vibration is not available on iPhone. Alerts only ring while the app is open, so keep the screen on.</p></details>
<details><summary>Readiness & recovery</summary><p>Readiness is a training-management tool, not a diagnosis. Low readiness trims a set from each exercise. A recovery session cuts volume by about 30% and never advances a stage. After a 14+ day break Ascent cuts volume; after 28+ days it cuts more, without dropping your stage.</p></details>
<details><summary>Pain rule</summary><p>Joint pain is not a progression metric. Flag it, stop or modify the painful exercise, and never train through sharp or worsening pain. Persistent pain should be assessed by a qualified clinician.</p></details>
<details><summary>Skill practice</summary><p>Handstand and planche need strength plus balance, body-line control and tissue tolerance. A single best hold is not mastery. Use clean, repeatable work and safe bail-outs.</p></details>
<details><summary>Equipment</summary><p>Wall, a counter or table, a chair or low bench, a doorway pull-up bar. Never use an unstable chair for loaded support. Inspect equipment before each session.</p></details>
<details><summary>Data & privacy</summary><p>Progress lives in this browser only. Export a backup before switching devices or clearing site data. No account needed.</p></details>`}

/* ================= NAV / SETUP ================= */
function show(v){document.querySelectorAll('nav button,.view').forEach(x=>x.classList.remove('on'));document.querySelector(`nav button[data-v="${v}"]`).classList.add('on');$('v-'+v).classList.add('on');window.scrollTo(0,0)}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)});
function renderAll(){renderToday();renderProgress();renderRoad();renderLog();renderGuide()}
function openSetup(){
 const A=[['Push-ups','max clean reps'],['Pull-ups','max clean reps'],['Dead hang','seconds'],['Hollow hold','seconds'],['Chest-to-wall hold','seconds'],['L-sit','seconds'],['Squat','max clean reps']];
 $('assessment').innerHTML=A.map((x,i)=>`<div class="field"><label>${x[0]} · ${x[1]}</label><input type="number" inputmode="numeric" min="0" max="300" data-assess="${i}" placeholder="0"></div>`).join('');
 $('setup').classList.add('on');document.body.classList.add('lock')}
function closeSetup(){$('setup').classList.remove('on');document.body.classList.remove('lock')}
function applyAssessment(v){
 const[push,pull,hang,hollow,wall,lsit,squat]=v,T=S.tracks;
 T.push.stage=push>=25?idx('push','Elevated Pike Push-up'):push>=15?idx('push','Pike Push-up'):push>=8?idx('push','Low Incline Push-up'):0;
 T.pull.stage=pull>=8?4:pull>=5?3:pull>=1?2:hang>=30?1:0;
 T.core.stage=lsit>=10?3:lsit>=5?2:hollow>=30?1:0;
 T.handstand.stage=wall>=45?3:wall>=20?2:0;
 T.legs.stage=squat>=30?1:0;
 for(const k in T){T[k].clean=0;T[k].miss=0;T[k].prov=T[k].stage>0?2:0}
 S.planche=false;maybePlanche();S.startedAt=new Date().toISOString();S.draft={};save();closeSetup();renderAll();toast('Baseline applied. Placement is provisional; your first sessions confirm it.')}
$('saveSetup').addEventListener('click',()=>applyAssessment([...document.querySelectorAll('[data-assess]')].map(x=>Math.max(0,Number(x.value)||0))));
$('skipSetup').addEventListener('click',()=>{S.startedAt=new Date().toISOString();save();closeSetup();toast('Beginner starting point selected')});
$('setup').addEventListener('click',e=>{if(e.target.id==='setup')closeSetup()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('setup').classList.contains('on'))closeSetup()});

/* ================= SOUND ================= */
const seq=(list,reps,gap)=>{const o=[];for(let r=0;r<reps;r++)for(const[f,t,d,ty]of list)o.push([f,r*gap+t,d,ty]);return o};
const SND={
 silent:[],
 tick:[[880,0,.09,'sine']],
 go:[[1320,0,.32,'sine']],
 reach:[[1047,0,.3,'bell'],[1568,.16,.6,'bell']],
 chime:seq([[784,0,.5,'bell'],[988,.2,.5,'bell'],[1319,.4,.9,'bell']],3,1.5),
 bell:seq([[523,0,1.3,'bell'],[523,1,1.3,'bell']],2,2.2),
 beep:seq([[1000,0,.16,'sq'],[1000,.26,.16,'sq'],[1000,.52,.16,'sq']],3,1.1),
 alarm:seq([[1200,0,.18,'sq'],[900,.2,.18,'sq'],[1200,.4,.18,'sq'],[900,.6,.18,'sq']],4,1)};
const URLS={};
function mkWav(notes){
 const sr=16000;let end=0;notes.forEach(n=>end=Math.max(end,n[1]+n[2]));
 const N=Math.ceil((end+.1)*sr),b=new Float32Array(N),P=2*Math.PI;
 for(const[f,t0,d,ty]of notes){const s0=Math.floor(t0*sr),n=Math.floor(d*sr);
  for(let i=0;i<n&&s0+i<N;i++){const t=i/sr,at=Math.min(1,t/.004),env=at*Math.exp((ty==='sq'?-1.2:-4.5)*t/d);let v;
   if(ty==='sq')v=Math.sin(P*f*t)>0?.4:-.4;else if(ty==='bell')v=Math.sin(P*f*t)+.5*Math.sin(P*f*2.76*t)+.25*Math.sin(P*f*5.4*t);else v=Math.sin(P*f*t);
   b[s0+i]+=v*env}}
 let pk=0;for(let i=0;i<N;i++)pk=Math.max(pk,Math.abs(b[i]));const g=pk?.9/pk:1;
 const buf=new ArrayBuffer(44+N*2),dv=new DataView(buf),w=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');dv.setUint32(4,36+N*2,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,N*2,true);
 for(let i=0;i<N;i++)dv.setInt16(44+i*2,Math.max(-1,Math.min(1,b[i]*g))*32767,true);
 return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}))}
const sndUrl=n=>URLS[n]||(URLS[n]=mkWav(SND[n]));
/* Two <audio> elements (not WebAudio) so alerts still play with the iPhone silent switch on. */
let AU=null;
try{AU={tick:new Audio(),ring:new Audio()}}catch(e){}
let unlocked=false;
function unlock(){if(unlocked||!AU)return;unlocked=true;for(const k in AU){try{AU[k].src=sndUrl('silent');AU[k].volume=0;const p=AU[k].play();if(p&&p.then)p.then(()=>AU[k].pause()).catch(()=>{unlocked=false})}catch(e){unlocked=false}}}
['pointerdown','touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
function play(kind){
 if(!S.settings.sound||!AU)return;
 const a=kind==='ring'?AU.ring:AU.tick,name=kind==='ring'?S.settings.tone:kind;
 try{a.pause();a.src=sndUrl(name);a.volume=VOL[S.settings.vol]||.7;a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function stopAlarm(){if(!AU)return;try{AU.ring.pause();AU.ring.currentTime=0}catch(e){}}
const buzz=p=>{if(S.settings.vibrate&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
async function notify(title,body){
 if(!('Notification'in window)||Notification.permission!=='granted')return;
 try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(),o={body,icon:'icon-192.png',badge:'icon-192.png',tag:'ascent-timer',renotify:true,vibrate:[300,120,300]};if(reg)reg.showNotification(title,o);else new Notification(title,o)}catch(e){}}
let wl=null;
async function awake(on){if(!('wakeLock'in navigator))return;try{if(on&&S.settings.awake&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!on&&wl){const w=wl;wl=null;await w.release()}}catch(e){wl=null}}

/* ================= TIMER ENGINE ================= */
let TM={mode:null},worker=null,ivl=null,hideT=null;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function run(){halt();try{worker=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},250)'],{type:'text/javascript'})));worker.onmessage=step}catch(e){worker=null;ivl=setInterval(step,250)}}
function halt(){if(worker){worker.terminate();worker=null}if(ivl){clearInterval(ivl);ivl=null}}
function ui(){const dock=TM.mode==='rest'||TM.mode==='done',hold=TM.mode==='ready'||TM.mode==='hold';$('dock').hidden=!dock;$('hold').hidden=!hold;document.body.classList.toggle('tm',dock||hold);document.body.classList.toggle('lock',hold||$('setup').classList.contains('on'))}
function endTimer(){clearTimeout(hideT);stopAlarm();halt();TM={mode:null};try{localStorage.removeItem(RESTKEY)}catch(e){}ui();awake(false)}
function startRest(sec){
 unlock();clearTimeout(hideT);stopAlarm();
 TM={mode:'rest',dur:sec,end:Date.now()+sec*1000,lastSec:null};
 try{localStorage.setItem(RESTKEY,String(TM.end))}catch(e){}
 awake(true);run();step()}
function startHold(k,i){
 unlock();clearTimeout(hideT);stopAlarm();
 const st=TRACKS[k].stages[S.tracks[k].stage],rdy=readyFor(k);
 TM={mode:rdy>0?'ready':'hold',k,i,name:st[0],target:st[2],end:Date.now()+rdy*1000,start:Date.now(),reached:false,lastSec:null};
 try{localStorage.removeItem(RESTKEY)}catch(e){}
 awake(true);run();if(!rdy)beginHold();step()}
function beginHold(){TM.mode='hold';TM.start=Date.now();TM.reached=false;play('go');buzz(200)}
function finishRest(late){
 TM.mode='done';halt();try{localStorage.removeItem(RESTKEY)}catch(e){}
 if(late<30000){play('ring');buzz([300,120,300,120,500])}
 if(document.hidden)notify('Rest over','Next set. Time to go.');
 awake(false);
 $('dock').classList.add('go');$('dkLabel').textContent='REST OVER';$('dkTime').textContent='GO';$('dkBar').style.width='100%';$('dkAdj').hidden=true;$('dkSkip').textContent='Dismiss';
 ui();clearTimeout(hideT);hideT=setTimeout(endTimer,12000)}
function step(){
 const now=Date.now();
 if(TM.mode==='rest'||TM.mode==='ready'){
  const left=Math.ceil((TM.end-now)/1000);
  if(left>0){
   if(left<=3&&left!==TM.lastSec&&S.settings.count)play('tick');
   TM.lastSec=left;
   if(TM.mode==='rest'){$('dock').classList.remove('go');$('dkLabel').textContent='REST';$('dkTime').textContent=fmt(left);$('dkBar').style.width=Math.min(100,100-left/TM.dur*100)+'%';$('dkAdj').hidden=false;$('dkSkip').textContent='Skip'}
   else{$('hold').classList.remove('ok');$('hPhase').textContent='GET READY';$('hTime').textContent=left;$('hSub').textContent=TM.name+' · set '+(TM.i+1);$('hBar').style.width='0';$('hStop').textContent='START NOW';$('hCancel').hidden=false}
   ui()}
  else if(TM.mode==='rest')finishRest(now-TM.end);
  else{beginHold();step()}}
 else if(TM.mode==='hold'){
  const el=Math.floor((now-TM.start)/1000);
  if(!TM.reached&&el>=TM.target){TM.reached=true;play('reach');buzz([250,100,250]);if(document.hidden)notify('Target reached',TM.name+' · '+TM.target+'s')}
  $('hold').classList.toggle('ok',TM.reached);$('hPhase').textContent=TM.reached?'TARGET REACHED':'HOLD';$('hTime').textContent=el;
  $('hSub').textContent=TM.reached?(el>TM.target?'+'+(el-TM.target)+'s over target':'Target '+TM.target+'s'):TM.name+' · target '+TM.target+'s';
  $('hBar').style.width=Math.min(100,el/TM.target*100)+'%';$('hStop').textContent='STOP & SAVE';$('hCancel').hidden=false;ui()}}
function stopHold(){
 if(TM.mode==='ready'){beginHold();step();return}
 if(TM.mode!=='hold')return;
 const k=TM.k,i=TM.i,el=Math.min(600,Math.floor((Date.now()-TM.start)/1000));
 endTimer();
 if(el<1){toast('Too short. Nothing saved.');return}
 S.draft[k+'_'+i]=String(el);save();
 const inp=document.querySelector(`input[data-k="${k}"][data-i="${i}"]`);if(inp){inp.value=String(el);inp.dataset.was=String(el)}
 toast('Set '+(i+1)+': '+el+'s saved');
 if(S.settings.auto&&!isFinalSet(k,i))startRest(S.settings.rest)}
$('hStop').addEventListener('click',stopHold);
$('hCancel').addEventListener('click',()=>{endTimer();toast('Timer cancelled')});
$('dock').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tm==='skip')endTimer();
 else if(TM.mode==='rest'){const d=+b.dataset.tm;TM.end+=d*1000;TM.dur=Math.max(1,TM.dur+d);try{localStorage.setItem(RESTKEY,String(TM.end))}catch(x){}step()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(TM.mode==='rest'||TM.mode==='ready'||TM.mode==='hold')){awake(true);step()}});
function resumeRest(){try{const end=+localStorage.getItem(RESTKEY);if(end>Date.now()){TM={mode:'rest',dur:Math.ceil((end-Date.now())/1000),end,lastSec:null};run();step()}else localStorage.removeItem(RESTKEY)}catch(e){}}

/* ================= BOOT ================= */
renderAll();
if(!S.sessions&&!S.startedAt)setTimeout(openSetup,350);
resumeRest();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
